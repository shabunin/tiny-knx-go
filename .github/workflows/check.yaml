name: Check
on:
  push:
    branches:
      - master
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false  # no dependencies
      - run: make test
  tinygo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"  # must be a Go release supported by the TinyGo version below
          cache: false
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: 0.44.0
          install-binaryen: false  # only for WebAssembly
      # The QEMU packages are cached: the Ubuntu mirror of the runners is sometimes very slow.
      # RISC-V is in qemu-system-riscv since Ubuntu 26.04 (QEMU 10), no longer in qemu-system-misc.
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: qemu-${{ runner.os }}-${{ runner.arch }}-v2
      - run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" qemu-system-arm qemu-system-riscv
          sudo chmod -R a+rX ~/apt-cache
      - run: make tinygo-test
      - run: make tinygo-build
